# Development server in a container: docker compose up, then open http://localhost:5186
# Tests in the same container: docker compose run --rm dev npm test
services:
  dev:
    image: node:22-bookworm-slim
    working_dir: /app
    network_mode: bridge   # the default bridge: no project network to create
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5186:5186"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
